<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Confirmación de registro para Protocolo Unlocked." />
    <title>Registro recibido — Protocolo Unlocked</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="icon" href="../assets/unlocked-mark.webp" type="image/webp" />
  </head>
  <body class="thanks-page">
    <main class="thanks-page__main">
      <section class="thanks-card" aria-labelledby="thanks-title">
        <a class="brand thanks-card__brand" href="../" aria-label="Volver a Protocolo Unlocked">
          <img
            class="brand__mark"
            src="../assets/unlocked-mark.webp"
            width="40"
            height="40"
            alt=""
          />
          <span class="brand__text">Unlocked Ecom</span>
        </a>
        <p class="eyebrow">Protocolo Unlocked</p>
        <h1 id="thanks-title">Tu registro fue recibido</h1>
        <p class="thanks-card__lead">
          Guarda la fecha: jueves 30 de julio de 2026 a las 8:00 PM, hora de Colombia.
        </p>
        <div class="thanks-card__action" data-whatsapp-url="">
          <button class="btn btn--primary btn--block" type="button" disabled aria-disabled="true">
            Entrar al grupo de WhatsApp
          </button>
          <p role="status">
            El enlace del grupo todavía está pendiente. Lo habilitaremos aquí cuando quede confirmado.
          </p>
        </div>
        <a class="thanks-card__back" href="../">Volver a la información del webinar</a>
      </section>
    </main>
  </body>
</html>
